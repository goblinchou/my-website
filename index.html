<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>可芙路 CROIFFLE-RO｜可頌鬆餅專賣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF5EC;--surface:#FFFFFF;--ink:#3A2416;--muted:#7A6352;--ube:#9A4F1C;--line:#E8D9C4;--yuzu:#F2B544;--onyuzu:#3A2416;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#20160F;--surface:#2D2018;--ink:#F6EBDD;--muted:#C4AE98;--ube:#E8A860;--line:#43322A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#20160F;--surface:#2D2018;--ink:#F6EBDD;--muted:#C4AE98;--ube:#E8A860;--line:#43322A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.8 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
h1,h2,.serif{font-family:"Noto Serif TC","Songti TC",serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--ube);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 1.25rem}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:1.25rem;padding-bottom:1.25rem}
.logo{font-weight:900;font-size:1.25rem;text-decoration:none;letter-spacing:.08em}
nav{display:flex;gap:1.25rem}
nav a{text-decoration:none;color:var(--muted)}
nav a:hover{color:var(--ink)}
.hero{padding:2rem 0 1.5rem}.cover{display:block;width:100%;height:auto;border-radius:20px;margin-bottom:1rem}.pick{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:start}
h1{font-weight:900;font-size:clamp(2.4rem,6.5vw,4.6rem);line-height:1.2;margin:0 0 1.25rem;color:var(--ube)}
.hero p{max-width:30em;color:var(--muted);margin:0 0 1.5rem}
.btn{display:inline-block;background:var(--yuzu);color:var(--onyuzu);border:0;border-radius:999px;padding:.7rem 1.6rem;font:500 1rem "Noto Sans TC",sans-serif;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(.95)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.stage{display:flex;flex-direction:column;align-items:flex-start}
.plate{width:100%;max-width:420px;aspect-ratio:1;border-radius:24px;object-fit:cover;display:block}
.plate .emoji{font-size:clamp(5rem,14vw,8rem);line-height:1}
.plate.pop{animation:pop .35s ease}
@keyframes pop{from{opacity:.4;transform:scale(.96)}to{opacity:1;transform:none}}}
.info{margin-top:1.25rem;max-width:22rem}
.info h2{margin:0;font-size:1.6rem}
.info .price{color:var(--ube);font-weight:500;margin:.1rem 0 .5rem}
.info p{margin:0 0 1rem;color:var(--muted)}
section{padding:3rem 0}
h2.title{font-size:clamp(1.6rem,3.5vw,2.2rem);margin:0 0 1.5rem}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:.75rem}
.row{display:flex;align-items:center;gap:1rem;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.8rem 1rem;cursor:pointer;color:inherit;font:inherit}
.row[aria-pressed="true"]{border-color:var(--ube);box-shadow:0 0 0 1px var(--ube)}
.row img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
.row .n{font-weight:500;display:block}
.row .p{color:var(--muted);font-size:.9rem}
.story{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;border-top:1.5px solid var(--line)}
.story p{margin:0 0 1rem;color:var(--muted);max-width:34em}
.facts{margin:0;padding:0;list-style:none}
.facts li{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.facts span:first-child{color:var(--muted)}
.order{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:1.5rem}
.line{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.step{display:inline-flex;align-items:center;gap:.5rem}
.step button{width:2rem;height:2rem;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:1.1rem;line-height:1}
.total{display:flex;justify-content:space-between;font-weight:500;font-size:1.15rem;padding:1rem 0 .5rem}
textarea{width:100%;min-height:6.5rem;margin:.5rem 0 1rem;padding:.75rem;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.hint{color:var(--muted);margin:0 0 1rem}
footer{padding:2rem 0 3rem;color:var(--muted);font-size:.9rem;border-top:1.5px solid var(--line)}
@media (max-width:760px){.pick,.story{grid-template-columns:1fr}nav{gap:.9rem}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.plate.pop{animation:none}}
.cat{margin:0 0 2rem}.cat h3{font-size:1.15rem;margin:0 0 .75rem;color:var(--ube)}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
.item{display:flex;flex-direction:column;align-items:stretch;gap:.5rem;text-align:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.6rem .6rem .8rem}
.item .n{font-weight:500;display:block;line-height:1.4}.item .t{display:block;font-size:.85rem;color:var(--muted);line-height:1.4}
.add{flex:none;align-self:center;width:2.2rem;height:2.2rem;border-radius:50%;border:0;background:var(--yuzu);color:var(--onyuzu);font-size:1.2rem;line-height:1;cursor:pointer}
.add:hover{filter:brightness(.95)}.logo .en{font:500 .7rem "Noto Sans TC",sans-serif;letter-spacing:.1em;color:var(--muted);margin-left:.5rem}
.th{display:block;width:100%;aspect-ratio:4/3;border-radius:10px;background:#fff;overflow:hidden}
.th img{width:100%;height:100%;object-fit:contain;display:block}
.th.k:empty::after{content:"\1F950";font-size:1.5rem;opacity:.55}.th.w:empty::after{content:"\1F9C7";font-size:1.5rem;opacity:.55}
.item .tx{flex:1;min-width:0}
.logo{display:inline-flex;align-items:center;gap:.6rem}.mark{width:56px;height:56px;border-radius:12px;background:#fff;display:block}
header .wrap{flex-wrap:wrap;gap:.5rem 1rem}
@media (max-width:520px){.items{gap:.4rem}.item{padding:.4rem .4rem .6rem;gap:.35rem}.item .n{font-size:.82rem}.item .t{font-size:.72rem}.logo .en{display:none}.mark{width:48px;height:48px}}
</style>
</head>
